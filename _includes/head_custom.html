<meta name="referrer" content="no-referrer">

<script>
  (function() {
    try {
      var saved = localStorage.getItem('tfc_docs_theme');
      var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f6f2e8' : '#111614');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>

  onload="tfcRenderMath();"></script>
<script>
  window.tfcRenderMath = function(target) {
    if (typeof renderMathInElement === 'function') {
      var el = target || document.getElementById('main-content') || document.querySelector('main') || document.body;
      if (el) {
        renderMathInElement(el, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\(', right: '\\)', display: false},
            {left: '\\[', right: '\\]', display: true}
          ],
          throwOnError: false
        });
      }
    }
  };
</script>
