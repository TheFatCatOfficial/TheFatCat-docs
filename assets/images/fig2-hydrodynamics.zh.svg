<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#141923" />
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0b0e14" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2331" />
      <stop offset="100%" stop-color="#161c27" />
    </linearGradient>
  </defs>

  <rect width="1000" height="640" fill="url(#bgGrad2)" rx="16" />

  <!-- Title -->
  <text x="50" y="48" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">图 2：THE BELLY 流体动力学与离散限速防御</text>
  <text x="50" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">一阶指数阻尼轨迹、稳态平衡水位与 7-窗口离散限速模型</text>

  <!-- Left: Decay Plot Area -->
  <g transform="translate(60, 100)">
    <!-- Axes Grid -->
    <rect width="520" height="340" fill="#0f172a" rx="8" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Y Grid Lines & Labels -->
    <line x1="50" y1="40" x2="490" y2="40" stroke="#334155" stroke-dasharray="3" stroke-width="0.8" />
    <text x="42" y="44" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">100%</text>

    <line x1="50" y1="100" x2="490" y2="100" stroke="#334155" stroke-dasharray="3" stroke-width="0.8" />
    <text x="42" y="104" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">75%</text>

    <!-- 50% Threshold Highlight -->
    <line x1="50" y1="160" x2="490" y2="160" stroke="#f59e0b" stroke-dasharray="4" stroke-width="1.2" />
    <text x="42" y="164" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="end">50%</text>

    <line x1="50" y1="220" x2="490" y2="220" stroke="#334155" stroke-dasharray="3" stroke-width="0.8" />
    <text x="42" y="224" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">25%</text>

    <line x1="50" y1="280" x2="490" y2="280" stroke="#1e293b" stroke-width="1" />
    <text x="42" y="284" fill="#64748b" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">0%</text>

    <!-- X Axis Labels (Days) -->
    <text x="50" y="305" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">第 0 天</text>
    <text x="100" y="305" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">第 1 天</text>
    <text x="160" y="305" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">第 3 天</text>
    <text x="210" y="305" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">4.73 天</text>
    <text x="270" y="305" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">第 7 天</text>
    <text x="370" y="305" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">第 14 天</text>
    <text x="470" y="305" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">第 30 天</text>

    <!-- Mathematical Decay Curve Path -->
    <path d="M 50 40 C 66.67 50.9, 83.33 60.27, 100 72.7 C 120.0 87.62, 140.0 109.86, 160 125.3 C 176.67 138.17, 193.33 149.59, 210 160.0 C 230.0 172.5, 250.0 182.72, 270 193.9 C 303.33 212.53, 336.67 236.74, 370 249.1 C 403.33 261.46, 436.67 267.7, 470 277.0 L 470 280 L 50 280 Z" fill="url(#areaGrad)" />

    <path d="M 50 40 C 66.67 50.9, 83.33 60.27, 100 72.7 C 120.0 87.62, 140.0 109.86, 160 125.3 C 176.67 138.17, 193.33 149.59, 210 160.0 C 230.0 172.5, 250.0 182.72, 270 193.9 C 303.33 212.53, 336.67 236.74, 370 249.1 C 403.33 261.46, 436.67 267.7, 470 277.0" fill="none" stroke="url(#curveGrad)" stroke-width="2.5" />

    <!-- Half-life indicator dot -->
    <circle cx="210" cy="160" r="5" fill="#f59e0b" stroke="#fff" stroke-width="1.5" />
    <line x1="210" y1="160" x2="210" y2="290" stroke="#f59e0b" stroke-dasharray="3" stroke-width="1" />
    
    <rect x="150" y="115" width="120" height="36" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <text x="210" y="129" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">t_{1/2} ≈ 4.735 天</text>
    <text x="210" y="143" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">14.21 个餐次</text>

    <!-- Point Day 7 -->
    <circle cx="270" cy="193.9" r="3.5" fill="#38bdf8" />
    <text x="270" y="181" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">35.89%</text>

    <!-- Point Day 14 -->
    <circle cx="370" cy="249.1" r="3.5" fill="#818cf8" />
    <text x="370" y="236" fill="#818cf8" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">12.88%</text>

    <!-- Point Day 30 -->
    <circle cx="470" cy="277" r="3.5" fill="#64748b" />
    <text x="470" y="265" fill="#64748b" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">1.23%</text>

    <text x="50" y="20" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">指数阻尼衰减曲线: B(k) = B_0 × (20/21)^k（零外部流入极端假设）</text>
  </g>

  <!-- Right: 7-Window Rate Limiting Discrete Model -->
  <g transform="translate(610, 100)">
    <rect width="340" height="340" rx="8" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="28" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">7-窗口抽干防御模型</text>
    <text x="20" y="46" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Belly.sol 不可篡改窗口流出额度（16/168）</text>

    <rect x="18" y="60" width="304" height="60" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="28" y="78" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="10">单窗口上限: 余额 × 16 / 168</text>
    <text x="28" y="93" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10">单次提取后保留: (1 - 2/21) = 19/21</text>
    <text x="28" y="108" fill="#10b981" font-family="-apple-system, sans-serif" font-size="10">连续时间等价: ln(0.5)/ln(19/21) ≈ 55.4 小时</text>

    <text x="20" y="140" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">离散单步提取序列（连续 7 次顶格提取）：</text>

    <!-- Discrete Steps Table -->
    <g transform="translate(20, 152)">
      <text x="0" y="12" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">第 1 次提取 (t=0h):</text>
      <text x="135" y="12" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">剩余 90.48%</text>

      <text x="0" y="28" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">第 2 次提取 (t=8h):</text>
      <text x="135" y="28" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">剩余 81.86%</text>

      <text x="0" y="44" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">第 3 次提取 (t=16h):</text>
      <text x="135" y="44" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">剩余 74.06%</text>

      <text x="0" y="60" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">第 4 次提取 (t=24h):</text>
      <text x="135" y="60" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">剩余 67.01%</text>

      <text x="0" y="76" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">第 5 次提取 (t=32h):</text>
      <text x="135" y="76" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">剩余 60.63%</text>

      <text x="0" y="92" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">第 6 次提取 (t=40h):</text>
      <text x="135" y="92" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">剩余 54.85%</text>

      <text x="0" y="108" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">第 7 次提取 (t=48h):</text>
      <text x="135" y="108" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="10" font-weight="700">49.63% (突破 50% 阈值)</text>
    </g>

    <!-- Phase Range Box -->
    <rect x="18" y="278" width="304" height="48" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
    <text x="28" y="296" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">安全反应窗口: 48 至 56+ 小时</text>
    <text x="28" y="312" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">额度全新可用时: 48 小时 | 额度刚耗尽时: ~56 小时</text>
  </g>

  <!-- Bottom: Steady-State Watermark Panel -->
  <g transform="translate(60, 460)">
    <rect width="890" height="150" rx="8" fill="url(#cardGrad2)" stroke="#1e293b" stroke-width="1.5" />
    
    <text x="30" y="32" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">稳态平衡水位定理（STEADY-STATE EQUILIBRIUM）</text>
    <text x="30" y="52" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">在每 8 小时间隔税收恒定流入 I 的假设下，The Belly 达到动态流体动力学平衡：</text>

    <!-- Math Display Box -->
    <g transform="translate(30, 68)">
      <rect width="280" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="140" y="26" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle">动态平衡条件: B × α = I</text>
      <text x="140" y="46" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">B_{eq} = I / α = 21 × I</text>
    </g>

    <g transform="translate(330, 68)">
      <text x="10" y="20" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">机制物理诠释：</text>
      <text x="10" y="38" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• 在动态稳态下，金库资金池自然蓄积整整 21 餐次（1 周 / 168 小时）的协议税收总额。</text>
      <text x="10" y="54" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• 充当工业级减震水库：吸收瞬时交易量爆发洪峰，确保在低迷周期分红水流长流不息。</text>
    </g>
  </g>

</svg>
