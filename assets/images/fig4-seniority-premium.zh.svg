<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#141923" />
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2331" />
      <stop offset="100%" stop-color="#161c27" />
    </linearGradient>
    <linearGradient id="ladderGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <rect width="1000" height="680" fill="url(#bgGrad4)" rx="16" />
  <text x="50" y="46" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">图 4：资历倍数与仓位权重</text>
  <text x="50" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">相同本金下，资历影响分配权重；实际奖励仍取决于收入与结算。</text>
  <g transform="translate(50, 95)">
    <rect width="520" height="365" fill="#0f172a" rx="8" stroke="#1e293b" stroke-width="1.5" />
    <text x="25" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">从 1 档升至 22 档</text>
    <text x="25" y="46" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">每完成一个活跃餐次增加 1 档</text>
    <rect x="350" y="14" width="145" height="36" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <text x="422" y="28" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">满档后不再增长</text>
    <text x="422" y="41" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">最高 22 档</text>
    <line x1="135" y1="75" x2="490" y2="75" stroke="#f59e0b" stroke-dasharray="3" stroke-width="1" />
    <text x="125" y="79" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="end">22 倍（上限）</text>

    <line x1="135" y1="125" x2="490" y2="125" stroke="#334155" stroke-dasharray="3" stroke-width="0.8" />
    <text x="125" y="129" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="end">16 倍</text>

    <line x1="135" y1="175" x2="490" y2="175" stroke="#38bdf8" stroke-dasharray="3" stroke-width="0.8" />
    <text x="125" y="179" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="end">11.5 倍（示例均值）</text>

    <line x1="135" y1="225" x2="490" y2="225" stroke="#334155" stroke-dasharray="3" stroke-width="0.8" />
    <text x="125" y="229" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="end">6 倍</text>

    <line x1="135" y1="275" x2="490" y2="275" stroke="#1e293b" stroke-width="1" />
    <text x="125" y="279" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="end">1 倍（生效时）</text>
    <polygon points="140,275 153,265.5 166,256 179,246.5 192,237 205,227.5 218,218 230,208.5 243,199 256,189.5 269,180 282,170.5 295,161 308,151.5 321,142 333,132.5 346,123 359,113.5 372,104 385,94.5 398,85 410,75 490,75 490,275 140,275" fill="url(#areaGrad)" />
    <path d="M 140 275               L 153 265.5 L 166 256               L 179 246.5 L 192 237               L 205 227.5 L 218 218               L 230 208.5 L 243 199               L 256 189.5 L 269 180               L 282 170.5 L 295 161               L 308 151.5 L 321 142               L 333 132.5 L 346 123               L 359 113.5 L 372 104               L 385 94.5 L 398 85               L 410 75               L 490 75" fill="none" stroke="url(#ladderGrad)" stroke-width="3" />
    <circle cx="140" cy="275" r="4.5" fill="#38bdf8" stroke="#fff" stroke-width="1.5" />
    <circle cx="410" cy="75" r="5" fill="#f59e0b" stroke="#fff" stroke-width="1.5" />
    <circle cx="485" cy="75" r="4" fill="#f59e0b" />
    <line x1="140" y1="285" x2="490" y2="285" stroke="#334155" stroke-width="1.2" />
    <text x="140" y="303" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">0</text>
    <text x="205" y="303" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">5</text>
    <text x="269" y="303" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">10</text>
    <text x="333" y="303" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">15</text>
    <text x="410" y="303" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">21</text>
    <text x="465" y="303" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">之后</text>
    
    <text x="315" y="335" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">已完成的活跃餐次（标准节奏为每餐八小时）</text>
  </g>
  <g transform="translate(590, 95)">
    <rect width="360" height="365" rx="8" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="28" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">三种权重比较</text>
    <text x="20" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">比较资历时须区分本金与实际收益</text>
    <g transform="translate(18, 58)">
      <rect width="324" height="66" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">1. 同本金：满档与新生效仓位</text>
      <text x="310" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="end">22 倍</text>
      <text x="14" y="38" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• 新生效仓位从 1 档逐餐增加</text>
      <text x="14" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• 完成 21 个活跃餐次后达到相同资历</text>
    </g>
    <g transform="translate(18, 134)">
      <rect width="324" height="82" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
      <text x="14" y="20" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">2. 满档与整体平均资历</text>
      <text x="310" y="20" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="end">依平均值</text>
      <text x="14" y="37" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• 平均资历须按各仓位本金加权</text>
      <text x="14" y="51" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• 平均 11.5 档时，满档相对权重约 1.91 倍</text>
      <text x="14" y="65" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• 相对权重变化不等于收益率变化</text>
    </g>
    <g transform="translate(18, 226)">
      <rect width="324" height="66" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="20" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">3. 所有有效仓位均已满档</text>
      <text x="310" y="20" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="end">同资历</text>
      <text x="14" y="38" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• 大家均为 22 档时，资历倍数相同</text>
      <text x="14" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• 此时各仓位按本金比例分享奖励</text>
    </g>
    <g transform="translate(18, 304)">
      <rect width="324" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-dasharray="3" stroke-width="1" />
      <text x="162" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">★ 相同资历下，本金按比例影响权重</text>
      <text x="162" y="34" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">十倍本金对应十倍权重，不保证十倍收益</text>
    </g>
  </g>
  <g transform="translate(50, 480)">
    <rect width="900" height="165" rx="8" fill="url(#cardGrad4)" stroke="#1e293b" stroke-width="1.5" />
    <text x="30" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">时间增加资历，本金与资历共同决定仓位权重</text>
    
    <g transform="translate(30, 48)">
      <rect width="250" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="125" y="30" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">仓位分配权重</text>
      <text x="125" y="58" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">本金 × 资历</text>
      <text x="125" y="78" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" text-anchor="middle">各仓位份额取决于全体有效权重</text>
    </g>

    <g transform="translate(300, 48)">
      <rect width="570" height="95" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="20" y="24" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">理解本金与资历的影响</text>
      <text x="20" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• 资历相同时，十倍本金对应十倍权重。</text>
      <text x="20" y="62" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• 新仓本金若超过旧仓的 22 倍，仍可能拥有更高权重。</text>
      <text x="20" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• 新增质押可能稀释已有仓位；权重不代表固定收益。</text>
    </g>
  </g>

</svg>