<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#141923" />
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2331" />
      <stop offset="100%" stop-color="#161c27" />
    </linearGradient>
    <linearGradient id="ladderGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <rect width="1000" height="680" fill="url(#bgGrad4)" rx="16" />

  <!-- 标题 -->
  <text x="50" y="46" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">图 4：资历倍数爬坡、稳态溢价关系与本金线性约束</text>
  <text x="50" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">分段线性资历阶梯、稳态优势倍数与资本线性不变量</text>

  <!-- 左侧：资历阶梯图表 -->
  <g transform="translate(50, 95)">
    <rect width="520" height="365" fill="#0f172a" rx="8" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- 标题与公式 -->
    <text x="25" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">分段线性资历爬坡阶梯</text>
    <text x="25" y="46" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11">c_i(m) = 1 + min(m - j_i, 21)</text>

    <!-- 满级平台徽章 -->
    <rect x="350" y="14" width="145" height="36" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <text x="422" y="28" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">满级平台期</text>
    <text x="422" y="41" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">c_i = 22 (停止增长)</text>

    <!-- Y 轴网格线与刻度 -->
    <line x1="135" y1="75" x2="490" y2="75" stroke="#f59e0b" stroke-dasharray="3" stroke-width="1" />
    <text x="125" y="79" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="end">22.0x (封顶)</text>

    <line x1="135" y1="125" x2="490" y2="125" stroke="#334155" stroke-dasharray="3" stroke-width="0.8" />
    <text x="125" y="129" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">16.0x</text>

    <line x1="135" y1="175" x2="490" y2="175" stroke="#38bdf8" stroke-dasharray="3" stroke-width="0.8" />
    <text x="125" y="179" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">11.5x (均匀期望 c̄)</text>

    <line x1="135" y1="225" x2="490" y2="225" stroke="#334155" stroke-dasharray="3" stroke-width="0.8" />
    <text x="125" y="229" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">6.0x</text>

    <line x1="135" y1="275" x2="490" y2="275" stroke="#1e293b" stroke-width="1" />
    <text x="125" y="279" fill="#64748b" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">1.0x (初始起步)</text>

    <!-- 阶梯下面积填充 -->
    <polygon points="140,275 153,265.5 166,256 179,246.5 192,237 205,227.5 218,218 230,208.5 243,199 256,189.5 269,180 282,170.5 295,161 308,151.5 321,142 333,132.5 346,123 359,113.5 372,104 385,94.5 398,85 410,75 490,75 490,275 140,275" fill="url(#areaGrad)" />

    <!-- 阶梯折线 -->
    <path d="M 140 275 
             L 153 265.5 L 166 256 
             L 179 246.5 L 192 237 
             L 205 227.5 L 218 218 
             L 230 208.5 L 243 199 
             L 256 189.5 L 269 180 
             L 282 170.5 L 295 161 
             L 308 151.5 L 321 142 
             L 333 132.5 L 346 123 
             L 359 113.5 L 372 104 
             L 385 94.5 L 398 85 
             L 410 75 
             L 490 75" 
          fill="none" stroke="url(#ladderGrad)" stroke-width="3" />

    <!-- 起始圆点 -->
    <circle cx="140" cy="275" r="4.5" fill="#38bdf8" stroke="#fff" stroke-width="1.5" />
    <!-- 爬坡封顶圆点 -->
    <circle cx="410" cy="75" r="5" fill="#f59e0b" stroke="#fff" stroke-width="1.5" />
    <circle cx="485" cy="75" r="4" fill="#f59e0b" />

    <!-- X 轴线与刻度 -->
    <line x1="140" y1="285" x2="490" y2="285" stroke="#334155" stroke-width="1.2" />
    <text x="140" y="303" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">m=0</text>
    <text x="205" y="303" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">m=5</text>
    <text x="269" y="303" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">m=10</text>
    <text x="333" y="303" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">m=15</text>
    <text x="410" y="303" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">m=21 (第 7 天)</text>
    <text x="465" y="303" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">m≥22</text>
    
    <text x="315" y="335" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">活跃餐次流逝时间（每餐次 8 小时）</text>
  </g>

  <!-- 右侧：3 种对比参照系分析 -->
  <g transform="translate(590, 95)">
    <rect width="360" height="365" rx="8" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="28" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">3 种对比参照系分析</text>
    <text x="20" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">满级成熟仓位的相对优势边界</text>

    <!-- 参照系 1 -->
    <g transform="translate(18, 58)">
      <rect width="324" height="66" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">1. 满级仓位 vs 新增活跃质押者：</text>
      <text x="310" y="20" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="end">22.0x</text>
      <text x="14" y="38" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• 瞬时最大优势：新进质押者按期线性爬坡</text>
      <text x="14" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• 经过 21 个活跃餐次（7 天）后优势完全抹平</text>
    </g>

    <!-- 参照系 2 -->
    <g transform="translate(18, 134)">
      <rect width="324" height="82" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
      <text x="14" y="20" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">2. 满级仓位 vs 全池加权平均：</text>
      <text x="310" y="20" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="end">22 / c̄</text>
      <text x="14" y="37" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• 资历溢价 = 22 / c̄（c̄ 为本金加权平均资历系数）</text>
      <text x="14" y="51" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• 均匀分布时（c̄ = 11.5）产生约 1.913x 相对优势</text>
      <text x="14" y="65" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• 理论优势区间落在 [1.0x, 22.0x]</text>
    </g>

    <!-- 参照系 3 -->
    <g transform="translate(18, 226)">
      <rect width="324" height="66" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="20" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">3. 稳态静止池（零新增流入）：</text>
      <text x="310" y="20" fill="#10b981" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="end">1.0x</text>
      <text x="14" y="38" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• 当全体质押者均达到 22 级满级时，c̄ = 22</text>
      <text x="14" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• 资历溢价完全消退，恢复纯本金基础比例 1.0x</text>
    </g>

    <!-- 底部备注 -->
    <g transform="translate(18, 304)">
      <rect width="324" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-dasharray="3" stroke-width="1" />
      <text x="162" y="20" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" text-anchor="middle">★ 拒绝超线性资本特权</text>
      <text x="162" y="34" fill="#64748b" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">回报严格与资金规模呈一次线性关系</text>
    </g>
  </g>

  <!-- 底部面板：资本线性不变量 -->
  <g transform="translate(50, 480)">
    <rect width="900" height="165" rx="8" fill="url(#cardGrad4)" stroke="#1e293b" stroke-width="1.5" />
    <text x="30" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">核心定理：时间放大单笔资金权重，但整体回报严格对本金保持线性</text>
    
    <g transform="translate(30, 48)">
      <rect width="250" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="125" y="30" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">有效权重方程：</text>
      <text x="125" y="58" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">w_i = p_i × c_i(m)</text>
      <text x="125" y="78" fill="#64748b" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">质押本金 × 资历系数</text>
    </g>

    <g transform="translate(300, 48)">
      <rect width="570" height="95" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="20" y="24" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">巨鲸中性与绝对收益现实：</text>
      <text x="20" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• 在 100,000 门槛之上，资本以精确 1.0x 系数缩放：绝无任何超线性特权。</text>
      <text x="20" y="62" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• 拥有超过较早仓位 22 倍本金的后入者，其绝对权重依然更高。</text>
      <text x="20" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• 质押时长是耐心资本的非资金加权杠杆，而非对资本规模的剥夺。</text>
    </g>
  </g>

</svg>
