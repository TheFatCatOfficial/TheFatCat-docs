<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#141923" />
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2331" />
      <stop offset="100%" stop-color="#161c27" />
    </linearGradient>
    <linearGradient id="ladderGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <rect width="1000" height="640" fill="url(#bgGrad4)" rx="16" />

  <!-- Title -->
  <text x="50" y="48" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">FIGURE 4: SENIORITY MULTIPLIER &amp; RELATIVE ADVANTAGE</text>
  <text x="50" y="70" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Piecewise Linear Seniority Ramp, Equilibrium Advantage Multiplier, and Capital Bounds</text>

  <!-- Left Side: Seniority Step Ladder Plot -->
  <g transform="translate(60, 100)">
    <rect width="490" height="340" fill="#0f172a" rx="8" stroke="#1e293b" stroke-width="1.5" />
    
    <text x="30" y="30" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Seniority Coefficient Ramp: c_i(m) = 1 + min(m - j_i, 21)</text>

    <!-- Y-Axis Grid Lines & Labels -->
    <line x1="60" y1="60" x2="460" y2="60" stroke="#f59e0b" stroke-dasharray="3" stroke-width="1" />
    <text x="52" y="64" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="end">22.0x (Cap)</text>

    <line x1="60" y1="110" x2="460" y2="110" stroke="#334155" stroke-dasharray="3" stroke-width="0.8" />
    <text x="52" y="114" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">16.0x</text>

    <line x1="60" y1="160" x2="460" y2="160" stroke="#38bdf8" stroke-dasharray="3" stroke-width="0.8" />
    <text x="52" y="164" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">11.5x (Uniform c̄)</text>

    <line x1="60" y1="210" x2="460" y2="210" stroke="#334155" stroke-dasharray="3" stroke-width="0.8" />
    <text x="52" y="214" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">6.0x</text>

    <line x1="60" y1="260" x2="460" y2="260" stroke="#1e293b" stroke-width="1" />
    <text x="52" y="264" fill="#64748b" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">1.0x (Entry)</text>

    <!-- X Axis Labels (Intervals) -->
    <line x1="60" y1="270" x2="460" y2="270" stroke="#334155" stroke-width="1.2" />
    <text x="60" y="290" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">m=0</text>
    <text x="140" y="290" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">m=5</text>
    <text x="220" y="290" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">m=10</text>
    <text x="300" y="290" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">m=15</text>
    <text x="380" y="290" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">m=21 (7d)</text>
    <text x="440" y="290" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">m≥22</text>
    <text x="250" y="315" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Elapsed Active Protocol Intervals (8 Hours Each)</text>

    <!-- Ladder Step Line -->
    <!-- Start: (60, 260) -> End ramp: (380, 60) -> Plateau: (460, 60) -->
    <path d="M 60 260 
             L 75 250.5 L 75 250.5 
             L 90 241 L 105 231.5 
             L 120 222 L 135 212.5 
             L 150 203 L 165 193.5 
             L 180 184 L 195 174.5 
             L 210 165 L 225 155.5 
             L 240 146 L 255 136.5 
             L 270 127 L 285 117.5 
             L 300 108 L 315 98.5 
             L 330 89 L 345 79.5 
             L 360 70 L 380 60 
             L 460 60" 
          fill="none" stroke="url(#ladderGrad)" stroke-width="3" />

    <!-- Entry Dot -->
    <circle cx="60" cy="260" r="4.5" fill="#38bdf8" stroke="#fff" stroke-width="1.5" />
    <!-- Ramp End Dot -->
    <circle cx="380" cy="60" r="5" fill="#f59e0b" stroke="#fff" stroke-width="1.5" />
    <circle cx="450" cy="60" r="4" fill="#f59e0b" />

    <!-- Annotation on Plateau -->
    <rect x="330" y="80" width="120" height="34" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <text x="390" y="94" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">Mature Plateau</text>
    <text x="390" y="106" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">c_i = 22 (No Compounding)</text>
  </g>

  <!-- Right Side: 3 Reference Frames Analysis -->
  <g transform="translate(580, 100)">
    <rect width="360" height="340" rx="8" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="28" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">3 COMPARATIVE FRAMES</text>
    <text x="20" y="46" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Relative Advantage Boundaries for Mature Positions</text>

    <!-- Frame 1 -->
    <g transform="translate(18, 62)">
      <rect width="324" height="68" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="20" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">1. Mature vs New Active Entrant:</text>
      <text x="250" y="20" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="12" font-weight="700">22.0x</text>
      <text x="14" y="38" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">• Transient advantage: new entrants climb additively</text>
      <text x="14" y="52" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• Fully neutralizes after 21 active intervals (7 days)</text>
    </g>

    <!-- Frame 2 -->
    <g transform="translate(18, 140)">
      <rect width="324" height="84" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
      <text x="14" y="20" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">2. Mature vs Pool Weighted Average:</text>
      <text x="245" y="20" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="12" font-weight="700">22 / c̄</text>
      <text x="14" y="38" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">• Premium = 22 / c̄ (Where c̄ is principal-weighted mean)</text>
      <text x="14" y="52" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">• Uniform cohort distribution (c̄ = 11.5) yields ~1.913x</text>
      <text x="14" y="66" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• General theoretical range spans [1.0x, 22.0x]</text>
    </g>

    <!-- Frame 3 -->
    <g transform="translate(18, 234)">
      <rect width="324" height="68" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="20" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">3. Mature in Stationary Pool (Zero Inflow):</text>
      <text x="250" y="20" fill="#10b981" font-family="ui-monospace, monospace" font-size="12" font-weight="700">1.0x</text>
      <text x="14" y="38" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">• When all stakers reach level 22, c̄ = 22</text>
      <text x="14" y="52" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• Seniority premium fully dissipates to baseline 1.0x</text>
    </g>

    <text x="20" y="324" fill="#64748b" font-family="ui-monospace, monospace" font-size="9">*No superlinear scaling: Returns remain strictly linear with capital.</text>
  </g>

  <!-- Bottom Panel: Capital Linearity Invariant -->
  <g transform="translate(60, 465)">
    <rect width="880" height="145" rx="8" fill="url(#cardGrad4)" stroke="#1e293b" stroke-width="1.5" />
    <text x="30" y="30" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">CORE THEOREM: TIME AMPLIFIES UNIT CAPITAL, BUT TOTAL SCALE REMAINS LINEAR</text>
    
    <g transform="translate(30, 48)">
      <rect width="250" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="125" y="28" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">Effective Weight Equation:</text>
      <text x="125" y="52" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">w_i = p_i × c_i(m)</text>
    </g>

    <g transform="translate(300, 48)">
      <text x="10" y="18" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Whale Neutrality &amp; Absolute Yield Realities:</text>
      <text x="10" y="36" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• Above the 100,000 threshold, capital scales at exact 1.0x factor: zero superlinear privilege.</text>
      <text x="10" y="52" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• A short-term entrant with principal > 22× an older position still commands greater total weight in absolute terms.</text>
      <text x="10" y="68" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• Duration acts as a persistent non-capital weighting lever for patient capital, not an economic expropriation of scale.</text>
    </g>
  </g>

</svg>
