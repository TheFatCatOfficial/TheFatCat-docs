<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#141923" />
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2331" />
      <stop offset="100%" stop-color="#161c27" />
    </linearGradient>
    <linearGradient id="ladderGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <rect width="1000" height="680" fill="url(#bgGrad4)" rx="16" />

  <!-- Title -->
  <text x="50" y="46" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">FIGURE 4: SENIORITY MULTIPLIER &amp; RELATIVE ADVANTAGE</text>
  <text x="50" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Piecewise Linear Seniority Ramp, Equilibrium Advantage Multiplier, and Capital Bounds</text>

  <!-- Left Side: Seniority Step Ladder Plot -->
  <g transform="translate(50, 95)">
    <rect width="520" height="365" fill="#0f172a" rx="8" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Title & Formula (Left aligned) -->
    <text x="25" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Seniority Coefficient Ramp</text>
    <text x="25" y="46" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11">c_i(m) = 1 + min(m - j_i, 21)</text>

    <!-- Mature Plateau Badge (Right aligned, completely separated from title) -->
    <rect x="350" y="14" width="145" height="36" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <text x="422" y="28" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">Mature Plateau</text>
    <text x="422" y="41" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">c_i = 22 (No Compounding)</text>

    <!-- Y-Axis Grid Lines & Labels (All labels right-aligned at x=125, safely padded inside card) -->
    <line x1="135" y1="75" x2="490" y2="75" stroke="#f59e0b" stroke-dasharray="3" stroke-width="1" />
    <text x="125" y="79" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="end">22.0x (Cap)</text>

    <line x1="135" y1="125" x2="490" y2="125" stroke="#334155" stroke-dasharray="3" stroke-width="0.8" />
    <text x="125" y="129" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">16.0x</text>

    <line x1="135" y1="175" x2="490" y2="175" stroke="#38bdf8" stroke-dasharray="3" stroke-width="0.8" />
    <text x="125" y="179" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">11.5x (Uniform c̄)</text>

    <line x1="135" y1="225" x2="490" y2="225" stroke="#334155" stroke-dasharray="3" stroke-width="0.8" />
    <text x="125" y="229" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">6.0x</text>

    <line x1="135" y1="275" x2="490" y2="275" stroke="#1e293b" stroke-width="1" />
    <text x="125" y="279" fill="#64748b" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">1.0x (Entry)</text>

    <!-- Area Fill Under Ramp -->
    <polygon points="140,275 153,265.5 166,256 179,246.5 192,237 205,227.5 218,218 230,208.5 243,199 256,189.5 269,180 282,170.5 295,161 308,151.5 321,142 333,132.5 346,123 359,113.5 372,104 385,94.5 398,85 410,75 490,75 490,275 140,275" fill="url(#areaGrad)" />

    <!-- Ladder Step Line -->
    <!-- Start: (140, 275) -> End ramp: (410, 75) -> Plateau: (490, 75) -->
    <path d="M 140 275 
             L 153 265.5 L 166 256 
             L 179 246.5 L 192 237 
             L 205 227.5 L 218 218 
             L 230 208.5 L 243 199 
             L 256 189.5 L 269 180 
             L 282 170.5 L 295 161 
             L 308 151.5 L 321 142 
             L 333 132.5 L 346 123 
             L 359 113.5 L 372 104 
             L 385 94.5 L 398 85 
             L 410 75 
             L 490 75" 
          fill="none" stroke="url(#ladderGrad)" stroke-width="3" />

    <!-- Entry Dot -->
    <circle cx="140" cy="275" r="4.5" fill="#38bdf8" stroke="#fff" stroke-width="1.5" />
    <!-- Ramp End Dot -->
    <circle cx="410" cy="75" r="5" fill="#f59e0b" stroke="#fff" stroke-width="1.5" />
    <circle cx="485" cy="75" r="4" fill="#f59e0b" />

    <!-- X Axis Line & Labels (Intervals) -->
    <line x1="140" y1="285" x2="490" y2="285" stroke="#334155" stroke-width="1.2" />
    <text x="140" y="303" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">m=0</text>
    <text x="205" y="303" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">m=5</text>
    <text x="269" y="303" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">m=10</text>
    <text x="333" y="303" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">m=15</text>
    <text x="410" y="303" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">m=21 (7d)</text>
    <text x="465" y="303" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">m≥22</text>
    
    <text x="315" y="335" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Elapsed Active Protocol Intervals (8 Hours Each)</text>
  </g>

  <!-- Right Side: 3 Reference Frames Analysis -->
  <g transform="translate(590, 95)">
    <rect width="360" height="365" rx="8" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="28" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">3 COMPARATIVE FRAMES</text>
    <text x="20" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Relative Advantage Boundaries for Mature Positions</text>

    <!-- Frame 1 -->
    <g transform="translate(18, 58)">
      <rect width="324" height="66" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">1. Mature vs New Active Entrant:</text>
      <text x="310" y="20" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="end">22.0x</text>
      <text x="14" y="38" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Transient advantage: new entrants climb additively</text>
      <text x="14" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Fully neutralizes after 21 active intervals (7 days)</text>
    </g>

    <!-- Frame 2 -->
    <g transform="translate(18, 134)">
      <rect width="324" height="82" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
      <text x="14" y="20" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">2. Mature vs Pool Weighted Average:</text>
      <text x="310" y="20" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="end">22 / c̄</text>
      <text x="14" y="37" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Premium = 22 / c̄ (where c̄ is principal-weighted mean)</text>
      <text x="14" y="51" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Uniform cohort distribution (c̄ = 11.5) yields ~1.913x</text>
      <text x="14" y="65" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• General theoretical range spans [1.0x, 22.0x]</text>
    </g>

    <!-- Frame 3 -->
    <g transform="translate(18, 226)">
      <rect width="324" height="66" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="20" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">3. Mature in Stationary Pool (Zero Inflow):</text>
      <text x="310" y="20" fill="#10b981" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="end">1.0x</text>
      <text x="14" y="38" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• When all stakers reach level 22, c̄ = 22</text>
      <text x="14" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• Seniority premium fully dissipates to baseline 1.0x</text>
    </g>

    <!-- Frame Bottom Note (Two-line wrapped within dedicated badge, zero collision) -->
    <g transform="translate(18, 304)">
      <rect width="324" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-dasharray="3" stroke-width="1" />
      <text x="162" y="20" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" text-anchor="middle">★ NO SUPERLINEAR SCALING</text>
      <text x="162" y="34" fill="#64748b" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">Returns remain strictly linear with capital</text>
    </g>
  </g>

  <!-- Bottom Panel: Capital Linearity Invariant -->
  <g transform="translate(50, 480)">
    <rect width="900" height="165" rx="8" fill="url(#cardGrad4)" stroke="#1e293b" stroke-width="1.5" />
    <text x="30" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">CORE THEOREM: TIME AMPLIFIES UNIT CAPITAL, BUT TOTAL SCALE REMAINS LINEAR</text>
    
    <g transform="translate(30, 48)">
      <rect width="250" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="125" y="30" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">Effective Weight Equation:</text>
      <text x="125" y="58" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">w_i = p_i × c_i(m)</text>
      <text x="125" y="78" fill="#64748b" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">Principal × Seniority Coefficient</text>
    </g>

    <g transform="translate(300, 48)">
      <rect width="570" height="95" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="20" y="24" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Whale Neutrality &amp; Absolute Yield Realities:</text>
      <text x="20" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• Above the 100,000 threshold, capital scales at exact 1.0x factor: zero superlinear privilege.</text>
      <text x="20" y="62" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• A short-term entrant with principal > 22× an older position still commands greater total weight in absolute terms.</text>
      <text x="20" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• Duration acts as a persistent non-capital weighting lever for patient capital, not an economic expropriation of scale.</text>
    </g>
  </g>

</svg>
