<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#141923" />
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0b0e14" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2331" />
      <stop offset="100%" stop-color="#161c27" />
    </linearGradient>
  </defs>

  <rect width="1000" height="640" fill="url(#bgGrad2)" rx="16" />

  <!-- Title -->
  <text x="50" y="48" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">FIGURE 2: THE BELLY HYDRODYNAMICS &amp; RATE-LIMITING</text>
  <text x="50" y="70" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">一阶指数阻尼衰减轨迹、稳态平衡水位与 7 窗口离散限速防御模型</text>

  <!-- Left: Decay Plot Area -->
  <g transform="translate(60, 100)">
    <!-- Axes Grid -->
    <rect width="520" height="340" fill="#0f172a" rx="8" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Y Grid Lines & Labels -->
    <line x1="50" y1="40" x2="490" y2="40" stroke="#334155" stroke-dasharray="3" stroke-width="0.8" />
    <text x="42" y="44" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">100%</text>

    <line x1="50" y1="100" x2="490" y2="100" stroke="#334155" stroke-dasharray="3" stroke-width="0.8" />
    <text x="42" y="104" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">75%</text>

    <!-- 50% Threshold Highlight -->
    <line x1="50" y1="160" x2="490" y2="160" stroke="#f59e0b" stroke-dasharray="4" stroke-width="1.2" />
    <text x="42" y="164" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="end">50%</text>

    <line x1="50" y1="220" x2="490" y2="220" stroke="#334155" stroke-dasharray="3" stroke-width="0.8" />
    <text x="42" y="224" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">25%</text>

    <line x1="50" y1="280" x2="490" y2="280" stroke="#1e293b" stroke-width="1" />
    <text x="42" y="284" fill="#64748b" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">0%</text>

    <!-- X Axis Labels (Days) -->
    <text x="50" y="305" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Day 0</text>
    <text x="100" y="305" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Day 1</text>
    <text x="160" y="305" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Day 3</text>
    <text x="210" y="305" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">4.73d</text>
    <text x="270" y="305" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Day 7</text>
    <text x="370" y="305" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Day 14</text>
    <text x="470" y="305" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Day 30</text>

    <!-- Mathematical Decay Curve Path -->
    <!-- Day 0: 50, 40 (100%) -->
    <!-- Day 1 (k=3): 100, 72.7 (86.38%) -->
    <!-- Day 3 (k=9): 160, 125.3 (64.46%) -->
    <!-- Half life 4.735d: 210, 160 (50.0%) -->
    <!-- Day 7 (k=21): 270, 193.8 (35.89%) -->
    <!-- Day 14 (k=42): 370, 249.1 (12.88%) -->
    <!-- Day 30 (k=90): 470, 277.0 (1.23%) -->
    <path d="M 50 40 
             Q 120 85, 210 160 
             T 270 193.8 
             T 370 249.1 
             T 470 277 L 470 280 L 50 280 Z" fill="url(#areaGrad)" />

    <path d="M 50 40 
             Q 120 85, 210 160 
             T 270 193.8 
             T 370 249.1 
             T 470 277" fill="none" stroke="url(#curveGrad)" stroke-width="2.5" />

    <!-- Half-life indicator dot -->
    <circle cx="210" cy="160" r="5" fill="#f59e0b" stroke="#fff" stroke-width="1.5" />
    <line x1="210" y1="160" x2="210" y2="290" stroke="#f59e0b" stroke-dasharray="3" stroke-width="1" />
    
    <rect x="150" y="115" width="120" height="36" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <text x="210" y="129" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">t_{1/2} ≈ 4.735 Days</text>
    <text x="210" y="143" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">14.21 Intervals</text>

    <!-- Point Day 7 -->
    <circle cx="270" cy="193.8" r="3.5" fill="#38bdf8" />
    <text x="270" y="185" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">35.89%</text>

    <!-- Point Day 14 -->
    <circle cx="370" cy="249.1" r="3.5" fill="#818cf8" />
    <text x="370" y="240" fill="#818cf8" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">12.88%</text>

    <!-- Point Day 30 -->
    <circle cx="470" cy="277" r="3.5" fill="#64748b" />
    <text x="460" y="268" fill="#64748b" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">1.23%</text>

    <text x="50" y="20" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Exponential Damping Curve: B(k) = B_0 × (20/21)^k (Zero External Inflow)</text>
  </g>

  <!-- Right: 7-Window Rate Limiting Discrete Model -->
  <g transform="translate(610, 100)">
    <rect width="340" height="340" rx="8" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="28" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">7-WINDOW DRAIN LIMITER</text>
    <text x="20" y="46" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Belly.sol Immutable windowAllowance (16/168)</text>

    <rect x="18" y="60" width="304" height="60" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="28" y="78" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="10">Window Cap: Balance × 16 / 168</text>
    <text x="28" y="93" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10">Retained Per Pull: (1 - 2/21) = 19/21</text>
    <text x="28" y="108" fill="#10b981" font-family="ui-monospace, monospace" font-size="10">Continuous Equiv: ln(0.5)/ln(19/21) ≈ 55.4h</text>

    <text x="20" y="140" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Discrete Step Sequence (7 Pulls):</text>

    <!-- Discrete Steps Table -->
    <g transform="translate(20, 152)">
      <text x="0" y="12" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">Pull 1 (t=0h):</text>
      <text x="120" y="12" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">90.48% remaining</text>

      <text x="0" y="28" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">Pull 2 (t=8h):</text>
      <text x="120" y="28" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">81.86% remaining</text>

      <text x="0" y="44" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">Pull 3 (t=16h):</text>
      <text x="120" y="44" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">74.06% remaining</text>

      <text x="0" y="60" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">Pull 4 (t=24h):</text>
      <text x="120" y="60" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">67.01% remaining</text>

      <text x="0" y="76" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">Pull 5 (t=32h):</text>
      <text x="120" y="76" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">60.63% remaining</text>

      <text x="0" y="92" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">Pull 6 (t=40h):</text>
      <text x="120" y="92" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">54.85% remaining</text>

      <text x="0" y="108" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="10" font-weight="700">Pull 7 (t=48h):</text>
      <text x="120" y="108" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="10" font-weight="700">49.63% (&lt; 50% threshold)</text>
    </g>

    <!-- Phase Range Box -->
    <rect x="18" y="278" width="304" height="48" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
    <text x="28" y="296" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Reaction Window: 48h to 56h+</text>
    <text x="28" y="312" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">If allowance fresh: 48h (6 gaps) | If waiting: ~56h</text>
  </g>

  <!-- Bottom: Steady-State Watermark Panel -->
  <g transform="translate(60, 460)">
    <rect width="890" height="150" rx="8" fill="url(#cardGrad2)" stroke="#1e293b" stroke-width="1.5" />
    
    <text x="30" y="32" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">STEADY-STATE WATERMARK THEOREM (稳态平衡水位定理)</text>
    <text x="30" y="52" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Under constant fee inflow I per 8-hour interval, The Belly achieves dynamic hydrodynamic equilibrium:</text>

    <!-- Math Display Box -->
    <g transform="translate(30, 68)">
      <rect width="280" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="140" y="26" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle">Equilibrium Condition: B × α = I</text>
      <text x="140" y="46" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">B_{eq} = I / α = 21 × I</text>
    </g>

    <g transform="translate(330, 68)">
      <text x="10" y="20" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Physical Interpretation:</text>
      <text x="10" y="38" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• In dynamic equilibrium, the treasury balance naturally stores exactly 21 meals (1 full week / 168h) of protocol fee revenue.</text>
      <text x="10" y="54" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• Acts as an industrial shock absorber: dampens transient volume spikes while guaranteeing smooth outflow during dry periods.</text>
    </g>
  </g>

</svg>
