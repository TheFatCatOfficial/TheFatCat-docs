    <text x="20" y="68" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10">O(1): (1+m)P_climb - J_climb ...</text>
    <text x="20" y="84" fill="#10b981" font-family="ui-monospace, monospace" font-size="10">D1: Bal(Distributor) ≥ liability</text>
