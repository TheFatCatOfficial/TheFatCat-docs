<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#141923" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2331" />
      <stop offset="100%" stop-color="#161c27" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <marker id="ring-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>

  <rect width="1000" height="680" fill="url(#bgGrad3)" rx="16" />

  <!-- 标题 -->
  <text x="50" y="44" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">图 3：22 槽位毕业环形缓冲区常数移库机制</text>
  <text x="50" y="66" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">O(1) 常数复杂度分槽聚合、环形缓冲区轮转与满级移库</text>

  <!-- 左侧：环形缓冲区图形 -->
  <g transform="translate(310, 285)">
    <!-- 外环底座 -->
    <circle cx="0" cy="0" r="165" fill="none" stroke="#1e293b" stroke-width="7" />
    <circle cx="0" cy="0" r="165" fill="none" stroke="url(#ringGrad)" stroke-width="3.5" stroke-dasharray="8 6" opacity="0.75" />

    <!-- 环心枢纽：成熟满级池 (22 级) -->
    <circle cx="0" cy="0" r="82" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5" />
    <text x="0" y="-32" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">满级成熟池</text>
    <text x="0" y="-14" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">c_i = 22</text>
    <text x="0" y="5" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10.5" text-anchor="middle">P_{settled} 标量</text>
    <text x="0" y="21" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5" text-anchor="middle">永久满级</text>
    <text x="0" y="37" fill="#10b981" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" text-anchor="middle">权重: 22 × P_{settled}</text>

    <!-- 槽位 0：当前餐次结算槽位 -->
    <g transform="translate(0, -165)">
      <circle cx="0" cy="0" r="20" fill="#f59e0b" stroke="#fff" stroke-width="2" />
      <text x="0" y="4" fill="#0f172a" font-family="ui-monospace, monospace" font-size="11" font-weight="800" text-anchor="middle">0</text>
      <text x="0" y="-25" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">当前餐次槽位</text>
      <!-- 向中心迁移的箭头 -->
      <path d="M 0 24 L 0 74" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4" marker-end="url(#ring-arrow)" />
    </g>

    <!-- 21 个环形槽位 (R=165) -->
    <!-- 槽位 1 -->
    <circle cx="46.5" cy="-158.3" r="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="46.5" y="-154.3" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">1</text>

    <!-- 槽位 2 -->
    <circle cx="89.2" cy="-138.8" r="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="89.2" y="-134.8" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">2</text>

    <!-- 槽位 3 -->
    <circle cx="124.7" cy="-108.1" r="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="124.7" y="-104.1" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">3</text>

    <!-- 槽位 4 -->
    <circle cx="150.1" cy="-68.5" r="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="150.1" y="-64.5" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">4</text>

    <!-- 槽位 5 -->
    <circle cx="163.3" cy="-23.5" r="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="163.3" y="-19.5" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">5</text>

    <!-- 槽位 6 -->
    <circle cx="163.3" cy="23.5" r="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="163.3" y="27.5" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">6</text>

    <!-- 槽位 7 -->
    <circle cx="150.1" cy="68.5" r="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="150.1" y="72.5" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">7</text>

    <!-- 槽位 8 -->
    <circle cx="124.7" cy="108.1" r="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="124.7" y="112.1" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">8</text>

    <!-- 槽位 9 -->
    <circle cx="89.2" cy="138.8" r="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="89.2" y="142.8" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">9</text>

    <!-- 槽位 10 -->
    <circle cx="46.5" cy="158.3" r="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="46.5" y="162.3" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">10</text>

    <!-- 槽位 11 -->
    <circle cx="0.0" cy="165.0" r="13" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="0.0" y="169.0" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">11</text>

    <!-- 槽位 12 -->
    <circle cx="-46.5" cy="158.3" r="13" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-46.5" y="162.3" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">12</text>

    <!-- 槽位 13 -->
    <circle cx="-89.2" cy="138.8" r="13" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-89.2" y="142.8" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">13</text>

    <!-- 槽位 14 -->
    <circle cx="-124.7" cy="108.1" r="13" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-124.7" y="112.1" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">14</text>

    <!-- 槽位 15 -->
    <circle cx="-150.1" cy="68.5" r="13" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-150.1" y="72.5" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">15</text>

    <!-- 槽位 16 -->
    <circle cx="-163.3" cy="23.5" r="13" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-163.3" y="27.5" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">16</text>

    <!-- 槽位 17 -->
    <circle cx="-163.3" cy="-23.5" r="13" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-163.3" y="-19.5" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">17</text>

    <!-- 槽位 18 -->
    <circle cx="-150.1" cy="-68.5" r="13" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-150.1" y="-64.5" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">18</text>

    <!-- 槽位 19 -->
    <circle cx="-124.7" cy="-108.1" r="13" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-124.7" y="-104.1" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">19</text>

    <!-- 槽位 20 -->
    <circle cx="-89.2" cy="-138.8" r="13" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-89.2" y="-134.8" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">20</text>

    <!-- 槽位 21 -->
    <circle cx="-46.5" cy="-158.3" r="13" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="-46.5" y="-154.3" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">21</text>

    <!-- 轮转指示（顺时针推进至当前槽位） -->
    <path d="M -160 -95 A 190 190 0 0 1 -95 -160" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" marker-end="url(#ring-arrow)" />
    <text x="-135" y="-172" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="9.5" text-anchor="middle">餐次推进: slot = m % 22</text>
  </g>

  <!-- 右侧：闭式方程展开与操作分析 -->
  <g transform="translate(570, 85)">
    <!-- 卡片 1：闭式方程 -->
    <rect width="380" height="165" rx="8" fill="url(#cardGrad3)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="20" y="28" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">O(1) 闭式方程标量聚合展开式</text>
    <text x="20" y="46" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">SeniorityLedger.sol 标量聚合方程</text>

    <rect x="18" y="58" width="344" height="48" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="172" y="79" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">W(m) = (1 + m)·P_{climb} - J_{climb}</text>
    <text x="172" y="95" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">+ 22·P_{settled} + W_{exiting} - headOpening</text>

    <text x="20" y="126" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">P_{climb} = Σ p_i（爬坡本金总和，c_i &lt; 22）</text>
    <text x="20" y="142" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">J_{climb} = Σ (p_i · effectiveFrom_i)（加权序数标量）</text>
  </g>

  <g transform="translate(570, 265)">
    <!-- 卡片 2：常数复杂度迁移数学证明 -->
    <rect width="380" height="210" rx="8" fill="url(#cardGrad3)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="20" y="26" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">常数复杂度迁移证明 (CONSTANT-TIME)</text>
    <text x="20" y="42" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">为何 EVM Gas 消耗与质押者总数 N 严格解耦</text>

    <g transform="translate(18, 52)">
      <text x="0" y="14" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">1. 模运算槽位归属：</text>
      <text x="15" y="30" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">每个仓位质押进 slot = effectiveFrom mod 22</text>

      <text x="0" y="52" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">2. 单餐次单槽位迁移：</text>
      <text x="15" y="68" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">仅当前槽位 m % 22 (m - j = 21) 发生移库</text>
      <text x="15" y="82" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="9">P_{settled} += slotP[slot]; P_{climb} -= slotP[slot];</text>

      <text x="0" y="104" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">3. 零跨用户循环遍历：</text>
      <text x="15" y="120" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">无论 10 个还是 100 万质押者同时满级，合约仅执行</text>
      <text x="15" y="134" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">单次标量平衡转移，耗费 O(1) 常数 Gas</text>
    </g>
  </g>

  <!-- 底部横幅：扩展性保证与 Gas 对比 -->
  <g transform="translate(50, 495)">
    <rect width="900" height="155" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="30" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">GAS 复杂度对比：O(1) 资历核算 vs O(批次数) 用户领取</text>
    <text x="30" y="44" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">架构设计将高频协议时钟推进与个别质押者的分红领取彻底解耦</text>
    
    <g transform="translate(30, 56)">
      <rect width="405" height="78" rx="6" fill="#161c27" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">协议时钟推进 (advance):</text>
      <text x="16" y="42" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• Gas 消耗: ~185,000 Gas (固定的 22-槽位环形缓冲区轮转)</text>
      <text x="16" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• O(1) 复杂度: 与质押者总数 N 完全无关</text>
    </g>

    <g transform="translate(465, 56)">
      <rect width="405" height="78" rx="6" fill="#161c27" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">用户收益领取 (claim / claimThrough):</text>
      <text x="16" y="42" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• 前缀代数: O(1) 常数复杂度，跨越任意历史餐次</text>
      <text x="16" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• 采购批次: O(K) 线性复杂度，与待结算采购批次数相关</text>
    </g>
  </g>

</svg>
