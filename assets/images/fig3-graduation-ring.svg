  <rect width="1000" height="680" fill="url(#bgGrad3)" rx="16" />

  <!-- Title -->
  <text x="50" y="44" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">FIGURE 3: 22-COHORT GRADUATION RING MECHANICS</text>
  <text x="50" y="66" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">O(1) Constant Gas Cohort Aggregation, Ring Buffer Rotation, and Graduation Migration</text>

  <!-- Left Side: Circular Ring Graphic -->
  <g transform="translate(285, 275)">
