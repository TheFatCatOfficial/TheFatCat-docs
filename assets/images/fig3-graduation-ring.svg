    <!-- Slot 4 -->
    <circle cx="150.1" cy="-68.5" r="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="150.1" y="-64.5" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">4</text>

    <!-- Slot 5 -->
    <circle cx="163.3" cy="-23.5" r="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
