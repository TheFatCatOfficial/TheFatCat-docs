<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#141923" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2331" />
      <stop offset="100%" stop-color="#161c27" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <marker id="ring-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>

  <rect width="1000" height="640" fill="url(#bgGrad3)" rx="16" />

  <!-- Title -->
  <text x="50" y="48" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">FIGURE 3: 22-COHORT GRADUATION RING MECHANICS</text>
  <text x="50" y="70" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">基于 22 槽位环形缓冲区的 O(1) 常数级资历聚合与批次毕业移库机制</text>

  <!-- Left Side: Circular Ring Graphic -->
  <g transform="translate(300, 340)">
    <!-- Outer Ring Base -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#1e293b" stroke-width="8" />
    <circle cx="0" cy="0" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="8 6" opacity="0.7" />

    <!-- Center Hub: Settled Cohort Pool (Level 22) -->
    <circle cx="0" cy="0" r="85" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5" />
    <text x="0" y="-22" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">SETTLED COHORTS</text>
    <text x="0" y="-4" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">c_i = 22</text>
    <text x="0" y="16" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">P_{settled} Scalar</text>
    <text x="0" y="32" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Permanent Maturity</text>
    <text x="0" y="46" fill="#10b981" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">Weight: 22 × P_{settled}</text>

    <!-- 22 Circular Slots Generated Around the Ring (R=180) -->
    <!-- Angles = i * (360/22) = i * 16.3636 deg -->
    <!-- Slot 0: Top (0, -180) -->
    <!-- Slot 0: Active Graduation Target -->
    <g transform="translate(0, -180)">
      <circle cx="0" cy="0" r="22" fill="#f59e0b" stroke="#fff" stroke-width="2" />
      <text x="0" y="4" fill="#0f172a" font-family="ui-monospace, monospace" font-size="11" font-weight="800" text-anchor="middle">0</text>
      <text x="0" y="-30" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">CURRENT SLOT</text>
      <!-- Graduation Migration Arrow to Center -->
      <path d="M 0 24 L 0 88" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4" marker-end="url(#ring-arrow)" />
    </g>

    <!-- Other 21 slots around ring -->
    <!-- Angle helper: x = R*sin(a), y = -R*cos(a) -->
    <!-- Slot 1 (16.36 deg) -->
    <circle cx="50.7" cy="-172.7" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="50.7" y="-169" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">1</text>

    <!-- Slot 2 (32.73 deg) -->
    <circle cx="97.3" cy="-151.4" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="97.3" y="-148" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">2</text>

    <!-- Slot 3 (49.09 deg) -->
    <circle cx="136.0" cy="-117.8" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="136.0" y="-114" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">3</text>

    <!-- Slot 4 (65.45 deg) -->
    <circle cx="163.7" cy="-74.6" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="163.7" y="-71" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">4</text>

    <!-- Slot 5 (81.82 deg) -->
    <circle cx="178.2" cy="-25.6" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="178.2" y="-22" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">5</text>

    <!-- Slot 6 (98.18 deg) -->
    <circle cx="178.2" cy="25.6" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="178.2" y="29" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">6</text>

    <!-- Slot 7 (114.55 deg) -->
    <circle cx="163.7" cy="74.6" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="163.7" y="78" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">7</text>

    <!-- Slot 8 (130.91 deg) -->
    <circle cx="136.0" cy="117.8" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="136.0" y="121" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">8</text>

    <!-- Slot 9 (147.27 deg) -->
    <circle cx="97.3" cy="151.4" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="97.3" y="155" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">9</text>

    <!-- Slot 10 (163.64 deg) -->
    <circle cx="50.7" cy="172.7" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="50.7" y="176" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">10</text>

    <!-- Slot 11 (180.00 deg) -->
    <circle cx="0" cy="180.0" r="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="0" y="184" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">11</text>

    <!-- Slot 12 (196.36 deg) -->
    <circle cx="-50.7" cy="172.7" r="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-50.7" y="176" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">12</text>

    <!-- Slot 13 (212.73 deg) -->
    <circle cx="-97.3" cy="151.4" r="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-97.3" y="155" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">13</text>

    <!-- Slot 14 (229.09 deg) -->
    <circle cx="-136.0" cy="117.8" r="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-136.0" y="121" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">14</text>

    <!-- Slot 15 (245.45 deg) -->
    <circle cx="-163.7" cy="74.6" r="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-163.7" y="78" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">15</text>

    <!-- Slot 16 (261.82 deg) -->
    <circle cx="-178.2" cy="25.6" r="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-178.2" y="29" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">16</text>

    <!-- Slot 17 (278.18 deg) -->
    <circle cx="-178.2" cy="-25.6" r="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-178.2" y="-22" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">17</text>

    <!-- Slot 18 (294.55 deg) -->
    <circle cx="-163.7" cy="-74.6" r="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-163.7" y="-71" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">18</text>

    <!-- Slot 19 (310.91 deg) -->
    <circle cx="-136.0" cy="-117.8" r="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-136.0" y="-114" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">19</text>

    <!-- Slot 20 (327.27 deg) -->
    <circle cx="-97.3" cy="-151.4" r="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-97.3" y="-148" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">20</text>

    <!-- Slot 21 (343.64 deg) -->
    <circle cx="-50.7" cy="-172.7" r="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="-50.7" y="-169" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">21</text>

    <!-- Rotation Indicator -->
    <path d="M 120 -195 A 230 230 0 0 1 200 -110" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" marker-end="url(#ring-arrow)" />
    <text x="180" y="-180" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10">Roll: slot = m % 22</text>
  </g>

  <!-- Right Side: Mathematical Closed-Form & Operational Analysis -->
  <g transform="translate(560, 100)">
    <!-- Card 1: Closed Form Equation -->
    <rect width="390" height="155" rx="8" fill="url(#cardGrad3)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="20" y="28" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">O(1) CLOSED-FORM DECOMPOSITION</text>
    <text x="20" y="46" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">SeniorityLedger.sol Scalar Aggregation Equation</text>

    <rect x="18" y="58" width="354" height="48" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="195" y="80" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">W(m) = (1 + m)·P_{climb} - J_{climb}</text>
    <text x="195" y="96" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">+ 22·P_{settled} + W_{exiting}</text>

    <text x="20" y="124" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">P_{climb} = Σ p_i (Climbing principal sum, c_i &lt; 22)</text>
    <text x="20" y="140" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">J_{climb} = Σ (p_i · j_i) (Weighted activation index scalar)</text>
  </g>

  <g transform="translate(560, 275)">
    <!-- Card 2: Constant-Time Transition Proof -->
    <rect width="390" height="185" rx="8" fill="url(#cardGrad3)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="20" y="28" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">CONSTANT-TIME TRANSITION PROOF</text>
    <text x="20" y="46" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Why EVM Gas is Strictly Decoupled from Staker Count N</text>

    <g transform="translate(20, 60)">
      <text x="0" y="12" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">1. Modular Bucket Assignment:</text>
      <text x="15" y="28" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">Each position stakes into slot = activeFrom mod 22.</text>

      <text x="0" y="48" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">2. Single-Slot Graduation per Interval:</text>
      <text x="15" y="64" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">Only the current slot m % 22 (m - j = 21) migrates.</text>
      <text x="15" y="78" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="9">P_{settled} += slotP[slot]; P_{climb} -= slotP[slot];</text>

      <text x="0" y="98" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">3. Zero Iteration Across Stakers:</text>
      <text x="15" y="114" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">Whether 10 or 1,000,000 stakers mature, contract performs exactly ONE scalar balance transfer.</text>
    </g>
  </g>

  <!-- Bottom Banner: Scalability Guarantee -->
  <g transform="translate(60, 485)">
    <rect width="890" height="125" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="30" y="30" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">GAS COMPLEXITY SUMMARY: O(1) SENIORITY vs O(BATCHES) CLAIM</text>
    
    <g transform="translate(30, 45)">
      <rect width="400" height="60" rx="4" fill="#161c27" stroke="#334155" stroke-width="1" />
      <text x="15" y="22" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Protocol Clock Advance (advanceInterval):</text>
      <text x="15" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• Cost: ~185,000 Gas (Fixed 22-slot ring rotation)</text>
      <text x="15" y="52" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• Independent of N (zero staker iteration loops)</text>
    </g>

    <g transform="translate(460, 45)">
      <rect width="400" height="60" rx="4" fill="#161c27" stroke="#334155" stroke-width="1" />
      <text x="15" y="22" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">User Token Claim (claim / claimThrough):</text>
      <text x="15" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• Prefix math: O(1) across arbitrary history</text>
      <text x="15" y="52" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• Market batches: O(K) linear with executed batch count</text>
    </g>
  </g>

</svg>
