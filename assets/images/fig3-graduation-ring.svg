    <!-- Slot 14 -->
    <circle cx="-124.7" cy="108.1" r="13" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-124.7" y="112.1" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">14</text>

    <!-- Slot 15 -->
    <circle cx="-150.1" cy="68.5" r="13" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-150.1" y="72.5" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">15</text>

    <!-- Slot 16 -->
    <circle cx="-163.3" cy="23.5" r="13" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-163.3" y="27.5" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">16</text>

    <!-- Slot 17 -->
    <circle cx="-163.3" cy="-23.5" r="13" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-163.3" y="-19.5" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">17</text>

    <!-- Slot 18 -->
    <circle cx="-150.1" cy="-68.5" r="13" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-150.1" y="-64.5" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">18</text>

    <!-- Slot 19 -->
    <circle cx="-124.7" cy="-108.1" r="13" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-124.7" y="-104.1" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">19</text>

    <!-- Slot 20 -->
    <circle cx="-89.2" cy="-138.8" r="13" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-89.2" y="-134.8" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">20</text>

    <!-- Slot 21 -->
    <circle cx="-46.5" cy="-158.3" r="13" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="-46.5" y="-154.3" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">21</text>

    <!-- Rotation Indicator -->
    <path d="M 110 -175 A 210 210 0 0 1 180 -100" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" marker-end="url(#ring-arrow)" />
    <text x="165" y="-165" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="9.5">Roll: slot = m % 22</text>
  </g>

  <!-- Right Side: Mathematical Closed-Form & Operational Analysis -->
  <g transform="translate(540, 85)">
    <!-- Card 1: Closed Form Equation -->
    <rect width="410" height="165" rx="8" fill="url(#cardGrad3)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="20" y="28" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">O(1) CLOSED-FORM DECOMPOSITION</text>
    <text x="20" y="46" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">SeniorityLedger.sol Scalar Aggregation Equation</text>

    <rect x="18" y="58" width="374" height="48" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="205" y="79" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">W(m) = (1 + m)·P_{climb} - J_{climb}</text>
    <text x="205" y="95" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">+ 22·P_{settled} + W_{exiting}</text>

    <text x="20" y="126" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">P_{climb} = Σ p_i (Climbing principal sum, c_i &lt; 22)</text>
    <text x="20" y="142" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">J_{climb} = Σ (p_i · j_i) (Weighted activation index scalar)</text>
  </g>

  <g transform="translate(540, 265)">
    <!-- Card 2: Constant-Time Transition Proof -->
    <rect width="410" height="210" rx="8" fill="url(#cardGrad3)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="20" y="26" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">CONSTANT-TIME TRANSITION PROOF</text>
    <text x="20" y="42" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Why EVM Gas is Strictly Decoupled from Staker Count N</text>

    <g transform="translate(20, 52)">
      <text x="0" y="14" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">1. Modular Bucket Assignment:</text>
      <text x="15" y="30" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">Each position stakes into slot = activeFrom mod 22.</text>

      <text x="0" y="52" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">2. Single-Slot Graduation per Interval:</text>
      <text x="15" y="68" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">Only the current slot m % 22 (m - j = 21) migrates.</text>
      <text x="15" y="82" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="9">P_{settled} += slotP[slot]; P_{climb} -= slotP[slot];</text>

      <text x="0" y="104" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">3. Zero Iteration Across Stakers:</text>
      <text x="15" y="120" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">Whether 10 or 1,000,000 stakers mature, the contract</text>
      <text x="15" y="134" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">performs exactly ONE scalar balance transfer in O(1) gas.</text>
    </g>
  </g>

  <!-- Bottom Banner: Scalability Guarantee -->
  <g transform="translate(50, 495)">
    <rect width="900" height="155" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="30" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">GAS COMPLEXITY SUMMARY: O(1) SENIORITY vs O(BATCHES) CLAIM</text>
    <text x="30" y="44" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Architecture decouples high-frequency protocol clock ticks from individual staker reward claims</text>
    
    <g transform="translate(30, 56)">
      <rect width="405" height="78" rx="6" fill="#161c27" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Protocol Clock Advance (advanceInterval):</text>
      <text x="16" y="42" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• Cost: ~185,000 Gas (Fixed 22-slot ring buffer rotation)</text>
      <text x="16" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• O(1) Complexity: Independent of total staker count N</text>
    </g>

    <g transform="translate(465, 56)">
      <rect width="405" height="78" rx="6" fill="#161c27" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">User Token Claim (claim / claimThrough):</text>
      <text x="16" y="42" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• Prefix Math: O(1) constant across arbitrary history</text>
      <text x="16" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">• Market Batches: O(K) linear with executed batch count</text>
    </g>
  </g>

</svg>
