    <!-- Slot 7 -->
    <circle cx="150.1" cy="68.5" r="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="150.1" y="72.5" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">7</text>

    <!-- Slot 8 -->
    <circle cx="124.7" cy="108.1" r="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="124.7" y="112.1" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">8</text>

    <!-- Slot 9 -->
    <circle cx="89.2" cy="138.8" r="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
