    <!-- Slot 12 -->
    <circle cx="-46.5" cy="158.3" r="13" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="-46.5" y="162.3" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">12</text>

    <!-- Slot 13 -->
    <circle cx="-89.2" cy="138.8" r="13" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
