<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <filter id="fibre" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".95 .42" numOctaves="3" seed="11" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .15  0 0 0 0 .13  0 0 0 0 .09  .42 0 0 0 -.19"/>
  </filter>
  <filter id="mottle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="2" seed="4" stitchTiles="stitch" result="m"/>
    <feColorMatrix in="m" type="matrix" values="0 0 0 0 .36  0 0 0 0 .29  0 0 0 0 .16  .34 0 0 0 -.12"/>
  </filter>
  <rect width="384" height="384" filter="url(#mottle)"/>
  <rect width="384" height="384" filter="url(#fibre)"/>
</svg>
