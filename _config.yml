title: TheFatCat Docs
description: Public protocol documentation for TheFatCat.
theme: just-the-docs
color_scheme: dark

url: https://thefatcatofficial.github.io
baseurl: /TheFatCat-docs
repository: TheFatCatOfficial/TheFatCat-docs

search_enabled: true
enable_copy_code_button: true
heading_anchors: false
nav_sort: case_sensitive
back_to_top: true
back_to_top_text: Back to top

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: yellow

aux_links:
  Main site: https://thefatcat.fun
  Public repository: https://github.com/TheFatCatOfficial/TheFatCat-docs

aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/TheFatCatOfficial/TheFatCat-docs
gh_edit_branch: main
gh_edit_source: /

footer_content: >-
  TheFatCat is an experimental DeFi protocol combining community Meme culture with
  automated transaction tax routing. Nothing in these documents constitutes financial
  advice or a promise of profit.

defaults:
  - scope:
      path: "assets"
    values:
      layout: nil
  - scope:
      path: ""
    values:
      layout: default
      lang: en
      has_toc: false
  - scope:
      path: "zh"
    values:
      layout: default
      lang: zh
      has_toc: false
